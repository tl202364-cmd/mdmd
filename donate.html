  body {

    background: #14181a; color: #e8e8e8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 16px; color: #55ff55; }
  label { display: block; font-size: 13px; color: #a9b4b8; margin: 12px 0 5px; }
  input[type=text], select {
    width: 100%; padding: 12px; font-size: 16px;
    background: #20272a; color: #fff;
    border: 0; outline: 1px solid #364247; border-radius: 8px;
  }
  input[type=text]:focus, select:focus { outline: 2px solid #55ff55; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; min-width: 0; }

  .check input { width: 18px; height: 18px; }
  .preview {
    margin-top: 18px; padding: 10px; border-radius: 8px; overflow-x: auto;
    background: repeating-conic-gradient(#22292c 0% 25%, #1a2023 0% 50%) 0 0 / 16px 16px;
  }
  canvas { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  button {
    width: 100%; margin-top: 16px; padding: 14px; font-size: 16px; font-weight: 700;
    background: #2fbf4a; color: #06200c; border: 0; border-radius: 8px; cursor: pointer;
  }
  button:active { background: #27a03e; }
  .hint { font-size: 12px; color: #7f8b90; margin-top: 10px; text-align: center; }
</style>

    '̉': { px: [[2,0],[3,1],[1,2],[2,2]], h: 3 },        // hỏi
    '̃': { px: [[0,0],[2,0],[3,0],[1,1],[2,1],[4,1]], h: 2 }, // ngã
    '̂': { px: [[1,0],[3,0],[2,1]], h: 2 },              // mũ â ê ô
    '̆': { px: [[2,0],[1,1],[3,1]], h: 2 },              // trăng ă
    '̈': { px: [[1,0],[3,0]], h: 1 },
    '̌': { px: [[2,0],[1,1],[3,1]], h: 2 }
  };
  var TALL = 'bdfhklt';
  var ARROW = [[12,-20,3,2],[10,-18,8,3],[12,-15,8,1],[1,-14,20,2],[0,-12,22,5],[1,-7,20,1],[12,-6,8,2],[10,-4,8,3],[12,-1,3,1]];

  function shade(hex) {
    var n = parseInt(hex.slice(1), 16);
    return 'rgb(' + (((n >> 16) & 255) >> 2) + ',' + (((n >> 8) & 255) >> 2) + ',' + ((n & 255) >> 2) + ')';
  }

  // tách chuỗi thành cụm: ký tự gốc + các dấu
  function clusters(str) {
    var s = str.replace(/đ/g, 'd̵').replace(/Đ/g, 'D̵').normalize('NFD');
    var out = [], cur = null;
    Array.from(s).forEach(function (ch) {
      var c = ch.codePointAt(0);
      if (cur && ((c >= 0x300 && c <= 0x36F))) cur.marks.push(ch);
      else { cur = { base: ch, marks: [] }; out.push(cur); }
    });
    return out;
  }

  // đo + (tuỳ chọn) vẽ một đoạn chữ; trả về vị trí x sau đoạn chữ
  function run(str, x0, base, color, bold, paint) {
    var cl = clusters(str);
    function pass(fill, ox, oyMC, oxU) {
      var x = x0;
      cl.forEach(function (g) {
        var code = g.base.codePointAt(0);
        if (g.base === '\u27A1') { // mũi tên: vẽ theo đúng hình trong ảnh gốc
          if (fill) {
            ctx.fillStyle = fill;
            ARROW.forEach(function (r) { ctx.fillRect(x + r[0] * S + ox, base + r[1] * S + oyMC, r[2] * S, r[3] * S); });
          }
          x += 24 * S;
          return;
        }
        if (code > 0xFF) { // ký tự ngoài font chính -> Unifont (như Minecraft)
          ctx.font = (8 * P) + 'px UniPix, monospace';
          var wU = ctx.measureText(g.base).width;
          if (fill) {
            ctx.fillStyle = fill;
            ctx.fillText(g.base, x + oxU, base + oxU);
            if (bold) ctx.fillText(g.base, x + oxU + P / 2, base + oxU);
          }
          x += wU + (bold ? P / 2 : 0);
          return;
        }
        ctx.font = (9 * P) + 'px MCPix, monospace';
        var units = Math.round(ctx.measureText(g.base).width / (P / 2));
        var adv = Math.ceil((units - 1) / 2);   // theo pixel Minecraft
        var w = Math.max(adv - 1, 1);
        var upper = g.base !== g.base.toLowerCase();
        var h = (!upper && TALL.indexOf(g.base) < 0) ? 5 : 7;
        var above = g.marks.filter(function (m) { return ABOVE[m]; });
        var horn = g.marks.indexOf('̛') >= 0;
        var dot = g.marks.indexOf('̣') >= 0;
        var stroke = g.marks.indexOf('̵') >= 0;
        var off = 0, stem = false;
        if (g.base === 'i' && above.length) { stem = true; off = 1; w = 3; adv = 4; }
        if (stroke && upper) { off = 1; adv += 1; }
        var cells = [];
        var cx = stem ? 1 : Math.floor((w - 1) / 2) + off;
        var sh = cx - 2;
        var row = h + 1, first = true;
        above.forEach(function (m) {
          var d = ABOVE[m], dx = 0, dy = 0;
          if (!first && d.px.length <= 4 && m !== '̃') { dx = 2; dy = -1; row -= 0; }
          d.px.forEach(function (q) { cells.push([q[0] + sh + dx, q[1] + row + dy]); });
          if (first || dx === 0) row += d.h;
          first = false;
        });
        if (first === false && above.length > 1) { /* dấu thứ hai đã đặt cạnh dấu mũ */ }
        if (dot) cells.push([cx, -2]);
        if (horn) { cells.push([w + off, h - 1]); cells.push([w + off + 1, h]); adv += 2; }
        if (stroke) {
          if (upper) { cells.push([0, 3]); cells.push([2, 3]); }
          else { cells.push([3, 5]); cells.push([5, 5]); adv += 1; }
        }
        if (stem) for (var r = 0; r < 5; r++) cells.push([1, r]);

        if (fill) {
          ctx.fillStyle = fill;
          if (!stem) {
            var gx = x + off * P - P / 2 + ox;
            ctx.fillText(g.base, gx, base + oyMC);
            if (bold) ctx.fillText(g.base, gx + P, base + oyMC);
          }
          cells.forEach(function (c) {
            ctx.fillRect(x + c[0] * P + ox, base - (c[1] + 1) * P + oyMC, bold ? 2 * P : P, P);
          });
        }
        x += (adv + (bold ? 1 : 0)) * P;
      });
      return x;
    }
    if (paint) {
      ctx.textBaseline = 'alphabetic';
      pass(shade(color), P, P, P / 2);
      return pass(color, 0, 0, 0);
    }
    return pass(null, 0, 0, 0);
  }

  function dashes(top, color) {
    var u = S;
    [[shade(color), 1.5 * u], [color, 0]].forEach(function (a) {
      ctx.fillStyle = a[0];
      for (var i = 0; i < 26; i++) ctx.fillRect((21 + i * 12) * u + a[1], top * u + a[1], 10 * u, 6 * u);
    });
  }

  function digits(s) { return (s || '').replace(/\D/g, ''); }
  function fmt(s) {
    var d = digits(s).replace(/^0+(?=\d)/, '');
    return d.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  var GREEN = '#55ff55', WHITE = '#ffffff', GRAY = '#aaaaaa', DARK = '#555555', AQUA = '#55ffff';

  function layout(paint) {
    var u = S;
    var name = nameEl.value.trim() || 'TenNguoiChoi';
    var amount = (fmt(amountEl.value) || '0') + 'đ';
    var shp = (fmt(shpEl.value) || '0') + ' SHP';

    // dòng tiêu đề (đường chân chữ y=68 trong ảnh gốc)
    var x = run('✦ NẠP THẺ THÀNH CÔNG ✦', 27 * u, 68 * u, GREEN, true, paint);
    // dòng thông tin (y=95)
    var x2 = 21 * u, b = 95 * u;
    x2 = run(name, x2, b, WHITE, false, paint);
    x2 = run(' vừa nạp ', x2, b, GRAY, false, paint);
    x2 = run(amount, x2, b, WHITE, false, paint);
    x2 = run(' ', x2, b, WHITE, false, paint);
    x2 = run('➡', x2, b, DARK, false, paint);
    x2 = run(' ', x2, b, WHITE, false, paint);
    x2 = run(shp, x2, b, AQUA, false, paint);
    return Math.max(x, x2) / u;
  }

  function draw() {
    S = parseInt(scaleEl.value, 10) || 2;
    P = 3 * S;
    var need = Math.ceil(layout(false)) + 30;
    var W = Math.max(BG_W, need), H = BG_H;
    cv.width = W * S; cv.height = H * S;
    ctx.clearRect(0, 0, cv.width, cv.height);

    if (!transEl.checked && bg.complete && bg.naturalWidth) {
      ctx.imageSmoothingEnabled = false;
      for (var i = 0, x = 0; x < W; i++, x += BG_W) { // tên dài thì lát thêm nền (lật gương để không lộ mép)
        ctx.save();
        if (i % 2) { ctx.translate((x + BG_W) * S, 0); ctx.scale(-1, 1); }
        else ctx.translate(x * S, 0);
        ctx.drawImage(bg, 0, 0, BG_W * S, BG_H * S);
        ctx.restore();
      }
    }
    dashes(29, DARK);
    layout(true);
    dashes(110, DARK);
  }

  function syncShp() {
    if (!autoEl.checked) return;
    var a = parseInt(digits(amountEl.value) || '0', 10);
    shpEl.value = fmt(String(Math.floor(a / 250)));
  }

  amountEl.addEventListener('input', function () { amountEl.value = fmt(amountEl.value); syncShp(); draw(); });
  shpEl.addEventListener('input', function () { shpEl.value = fmt(shpEl.value); autoEl.checked = false; draw(); });
  nameEl.addEventListener('input', draw);
  autoEl.addEventListener('change', function () { syncShp(); draw(); });
  transEl.addEventListener('change', draw);
  scaleEl.addEventListener('change', draw);

  $('dl').addEventListener('click', function () {
    draw();
    cv.toBlob(function (blob) {
      var a = document.createElement('a');
      var safe = (nameEl.value.trim() || 'vinhdanh').normalize('NFD').replace(/[^\w\-]+/g, '') || 'vinhdanh';
      a.href = URL.createObjectURL(blob);
      a.download = 'vinhdanh_' + safe + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    }, 'image/png');
  });

  draw();
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('27px MCPix', 'Ab1'), document.fonts.load('24px UniPix', '✦➡')]).then(draw, draw);
  }
})();
</script>
</body>
</html>
